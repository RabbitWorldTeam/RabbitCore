plugins {
    id 'java-library'
    id 'net.neoforged.moddev' version '2.0.148'
}

version = mod_version
group = mod_group_id
base { archivesName = mod_id }
java.toolchain.languageVersion = JavaLanguageVersion.of(21)

repositories {
    maven {
        url = 'https://cursemaven.com'
        content { includeGroup 'curse.maven' }
    }
    maven {
        url = 'https://maven.architectury.dev/'
        content { includeGroup 'dev.architectury' }
    }
}

neoForge {
    version = neo_version
    runs {
        client { client(); gameDirectory = file('run/neoforge-client') }
        server { server(); gameDirectory = file('run/neoforge-server'); programArgument '--nogui' }
    }
    mods { rabbitcore { sourceSet sourceSets.main } }
}

dependencies {
    implementation "dev.architectury:architectury-neoforge:${architectury_version}"
    implementation 'curse.maven:ftb-library-forge-404465:9008089'
    implementation 'curse.maven:ftb-teams-forge-404468:8724782'
    implementation 'curse.maven:ftb-quests-forge-289412:8216578'
    runtimeOnly 'curse.maven:ftb-xmod-compat-889915:7429014'
}

sourceSets.test.compileClasspath += sourceSets.main.compileClasspath
sourceSets.test.runtimeClasspath += sourceSets.main.runtimeClasspath

tasks.named('processResources', ProcessResources) {
    def properties = [mod_id: mod_id, mod_name: mod_name, mod_version: mod_version,
                      mod_license: mod_license, mod_authors: mod_authors, mod_description: mod_description,
                      minecraft_version: minecraft_version, neo_version: neo_version]
    inputs.properties properties
    filesMatching('META-INF/neoforge.mods.toml') { expand properties }
}

tasks.withType(JavaCompile).configureEach { options.encoding = 'UTF-8' }

tasks.register('bridgeTest', JavaExec) {
    dependsOn testClasses
    classpath = sourceSets.test.runtimeClasspath
    mainClass = 'com.tr4nce.rabbitcore.bridge.BridgeRegressionTest'
    workingDir = layout.buildDirectory.dir('bridge-test').get().asFile
    systemProperty 'jdk.net.unixdomain.tmpdir', layout.buildDirectory.dir('tmp/java').get().asFile.absolutePath
    doFirst {
        layout.buildDirectory.dir('tmp/java').get().asFile.mkdirs()
        workingDir.mkdirs()
    }
}
tasks.named('check') { dependsOn 'bridgeTest' }
tasks.named('test') { exclude '**/BridgeRegressionTest*.class' }
